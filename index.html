<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vrandolv Eyewear - Official Website</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #0b1325; color: #ffffff; text-align: center; padding: 20px; }
        header { padding: 40px 10px 20px; }
        h1 { color: #d4af37; font-size: 2.2rem; letter-spacing: 3px; margin-bottom: 5px; }
        p.subtitle { color: #a0aec0; font-size: 0.95rem; letter-spacing: 1px; }
        .container { max-width: 800px; margin: 30px auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .card { background: #162238; border: 1px solid #1e2d4a; border-radius: 12px; padding: 20px; text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; background-color: #0b1325; }
        .card h3 { margin: 15px 0 5px; color: #ffffff; font-size: 1.2rem; }
        .card .price { color: #d4af37; font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; }
        .btn-wa { display: inline-block; width: 100%; padding: 12px 0; background-color: #25d366; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .btn-wa:hover { background-color: #1eb954; }
        footer { margin-top: 50px; color: #718096; font-size: 0.85rem; padding-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>VRANDOLV EYEWEAR</h1>
        <p class="subtitle">Precision Custom Eyewear & Handmade Frames</p>
    </header>

    <div class="container">
        <!-- Produk 1 -->
        <div class="card">
            <img src="https://via.placeholder.com/300x200/162238/d4af37?text=Vrandolv+Frame+1" alt="Frame Vrandolv">
            <h3>Vrandolv Classic Series</h3>
            <div class="price">Rp250.000</div>
            <a href="https://wa.me/6281234567890?text=Halo%20Vrandolv%20Care,%20saya%20tertarik%20dengan%20Frame%20Classic%20Series" target="_blank" class="btn-wa">Pesan via WhatsApp</a>
        </div>

        <!-- Produk 2 -->
        <div class="card">
            <img src="https://via.placeholder.com/300x200/162238/d4af37?text=Vrandolv+Frame+2" alt="Frame Vrandolv">
            <h3>Vrandolv Custom CNC</h3>
            <div class="price">Rp350.000</div>
            <a href="https://wa.me/6281234567890?text=Halo%20Vrandolv%20Care,%20saya%20tertarik%20dengan%20Frame%20Custom%20CNC" target="_blank" class="btn-wa">Pesan via WhatsApp</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Vrandolv Eyewear. All rights reserved.</p>
    </footer>

</body>
</html>
