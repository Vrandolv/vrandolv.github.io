<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vrandolv Eyewear - Official Store</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f8f9fa; /* Background utama off-white bersih */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #222222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 32px;
            letter-spacing: 3px;
            color: #111111; /* Judul Hitam Elegan */
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        header p {
            font-size: 14px;
            color: #666666;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* CONTAINER KATALOG */
        .catalog {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
            width: 100%;
        }

        /* CARD PRODUK (PUTIH ELEGAN) */
        .card {
            background-color: #ffffff; /* Background kartu putih */
            border: 1px solid #e9ecef; /* Garis tepi halus */
            border-radius: 16px;
            padding: 24px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); /* Bayangan lembut */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        /* AREA FOTO PRODUK */
        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #e9ecef;
            margin-bottom: 20px;
        }

        /* DETAIL PRODUK */
        .card h3 {
            font-size: 20px;
            color: #111111;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .price {
            font-size: 18px;
            color: #b8860b; /* Warna Emas Premium untuk Harga */
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* TOMBOL WHATSAPP */
        .btn-wa {
            display: block;
            width: 100%;
            padding: 12px 0;
            background-color: #25D366; /* Hijau WhatsApp */
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            font-size: 15px;
            transition: background-color 0.2s ease;
        }

        .btn-wa:hover {
            background-color: #20ba5a;
        }

        /* FOOTER */
        footer {
            margin-top: 50px;
            font-size: 13px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <div>
        <header>
            <h1>VRANDOLV EYEWEAR</h1>
            <p>Precision Custom Eyewear & Handmade Frames</p>
        </header>

        <main class="catalog">
            <!-- PRODUK 1 -->
            <div class="card">
                <!-- Ganti src di bawah dengan link foto produk asli kamu -->
                <img src="https://via.placeholder.com/300x180?text=Vrandolv+Classic" alt="Vrandolv Classic Series" class="product-img">
                <h3>Vrandolv Classic Series</h3>
                <div class="price">Rp250.000</div>
                <a href="https://wa.me/6281234567890?text=Halo%20Vrandolv,%20saya%20mau%20pesan%20Classic%20Series" class="btn-wa" target="_blank">Pesan via WhatsApp</a>
            </div>

            <!-- PRODUK 2 -->
            <div class="card">
                <!-- Ganti src di bawah dengan link foto produk asli kamu -->
                <img src="https://via.placeholder.com/300x180?text=Vrandolv+Custom+CNC" alt="Vrandolv Custom CNC" class="product-img">
                <h3>Vrandolv Custom CNC</h3>
                <div class="price">Rp350.000</div>
                <a href="https://wa.me/6281234567890?text=Halo%20Vrandolv,%20saya%20mau%20pesan%20Custom%20CNC" class="btn-wa" target="_blank">Pesan via WhatsApp</a>
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Vrandolv Eyewear. All rights reserved.</p>
    </footer>

</body>
</html>
